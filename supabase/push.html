<!doctype html><meta charset="utf-8"><title>pushing…</title>
<body style="font:14px system-ui;padding:20px">
<script>
fetch('_push.sql').then(r => r.text()).then(t => {
  const msg = { sfos: true, sql: t, len: t.length };
  if (window.opener) window.opener.postMessage(msg, '*');
  document.title = 'pushed ' + t.length;
  document.body.append('ส่งแล้ว ' + t.length + ' ตัวอักษร');
});
</script>
